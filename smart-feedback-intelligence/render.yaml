services:

  # ── 1. FastAPI Backend ──────────────────────────────────
  - type: web
    name: feedback-intelligence-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: |
      pip install --timeout 300 torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
      python -c "import nltk; [nltk.download(r, quiet=True) for r in ['stopwords','wordnet','punkt','averaged_perceptron_tagger']]"

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: MLFLOW_TRACKING_URI
        value: /opt/render/project/src/mlruns
      - key: API_HOST
        value: "0.0.0.0"

  # ── 2. React Frontend (Static Site) ────────────────────
  - type: web
    name: feedback-intelligence-ui
    runtime: node
    plan: free
    region: oregon

    rootDir: smart-feedback-intelligence/frontend

    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        # Replace with your actual Render API URL after first deploy
        value: https://feedback-intelligence-api.onrender.com
