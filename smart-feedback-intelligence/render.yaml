# ── Render Deployment Config ──────────────────────────────
# Docs: https://render.com/docs/yaml-spec
# Deploy both API and frontend as separate Render services.

services:

  # ── 1. FastAPI Backend ──────────────────────────────────
  - type: web
    name: feedback-intelligence-api
    runtime: python
    plan: free                          # upgrade to starter for persistent disk
    region: oregon

    buildCommand: |
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
      python -c "import nltk; [nltk.download(r, quiet=True) for r in ['stopwords','wordnet','punkt','averaged_perceptron_tagger']]"

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true             # auto-generated secure key
      - key: MLFLOW_TRACKING_URI
        value: /opt/render/project/src/mlruns
      - key: API_HOST
        value: "0.0.0.0"

    # Persistent disk to store trained models between deploys
    disk:
      name: models-disk
      mountPath: /opt/render/project/src/saved_models
      sizeGB: 5

  # ── 2. React Frontend (Static Site) ────────────────────
  - type: web
    name: feedback-intelligence-ui
    runtime: node
    plan: free
    region: oregon

    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # SPA routing — serve index.html for all routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        # ⚠️ Replace with your actual Render API URL after first deploy
        value: https://feedback-intelligence-api.onrender.com
